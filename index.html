/* chart */
let ch,cs,data=[],extra=[],tool=null,replay=null,dr=[],rd=[];
function initChart(){if(!ch){
 ch=LightweightCharts.createChart($('chart'),{autoSize:true,layout:{background:{type:'solid',color:'#000'},textColor:'#b2b5be'},
  grid:{vertLines:{color:'#0d0d0f'},horzLines:{color:'#0d0d0f'}},rightPriceScale:{borderColor:'#2a2a2e',scaleMargins:{top:.15,bottom:.12}},
  timeScale:{borderColor:'#2a2a2e',timeVisible:true},crosshair:{mode:0}});
 cs=ch.addCandlestickSeries({upColor:'#2962ff',downColor:'#d1d4dc',wickUpColor:'#2962ff',wickDownColor:'#d1d4dc',borderVisible:false});
 ch.subscribeClick(p=>{if(!p.point||!tool)return;const pr=cs.coordinateToPrice(p.point.y);
  if(!Number.isFinite(pr))return;
  if(['trend','box','fib','pos','txt','v','brush','zig','xab','chan'].includes(tool)){
   const point={time:p.time,price:pr,x:p.point.x,y:p.point.y};
   if(!pendingDraw){pendingDraw=point;toast('Chagua point ya pili kwenye chart');return;}
   finishDrawing(pendingDraw,point,tool);pendingDraw=null;setTool(null);return;
  }
  if(tool==='h'){addDrawingLine(pr,'Horizontal line','#2962ff');toast('Horizontal line added')}
  setTool(null)});
 ch.subscribeCrosshairMove(p=>{const c=p.seriesData&&p.seriesData.get(cs);if(c)head(c)});
 loadChart()}}
function setTool(t){tool=t;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
document.querySelectorAll('#tools button').forEach(b=>{b.title=({'trend':'Trendline · click two points','h':'Horizontal line · click once','v':'Time marker · click two points','fib':'Fibonacci levels · click two points','xab':'Drawing · click two points','zig':'Zigzag line · click two points','chan':'Channel base line · click two points','pos':'Entry and target levels · click two points','brush':'Line drawing · click two points','box':'Zone bounds · click two points','txt':'Text label · click two points','clr':'Clear drawings'})[b.dataset.t]||b.dataset.t});
$('tools').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;
 if(t==='clr'){clearDrawings();toast('Drawings cleared');setTool(null)}else setTool(tool===t?null:t)};
function head(c){const x=X(st.sym);$('coll').innerHTML=ic('chev',14)+' '+extra.length; if(!c||!Number.isFinite(c.close)){ $('ct').innerHTML=`<div class="t1"><span class="tx">${st.sym} · ${x.n} · ${TFS[st.tf][1]}</span><span class="pl sim"><i class="dot"></i>NO LIVE FEED</span></div><small>Waiting for verified market data. No simulated prices or candles are shown.</small>`;return} const d=c.close-c.open; $('ct').innerHTML=`<div class="t1"><span class="tx">${st.sym} · ${x.n} · ${TFS[st.tf][1]}</span><span class="pl ${x.liveChart?'':'sim'}"><i class="dot"></i>${x.liveChart?'LIVE STREAM':'CANDLE DATA'}</span></div><small class="${d>=0?'pos':'neg'}">${fmt(x,c.close)} ${d>=0?'+':''}${d.toFixed(x.d)} (${(d/c.open*100).toFixed(2)}%)</small>`}
function loadChart(){if(!ch)return;const x=X(st.sym);replay=null;clearDrawings();clearSMC();

 data=[];x.liveChart=false;cs.setData([]);
 $('cb-sym').textContent=st.sym;$('tfb').textContent=TFS[st.tf][1];head(null);goLive(x);restoreAppliedScripts();}

/* bottom bar actions */
function syncUR(){$('undo').style.opacity=dr.length?1:.4;$('redo').style.opacity=rd.length?1:.4}
function addDrawingLine(price,title,color='#2962ff'){const p=cs.createPriceLine({price,color,lineWidth:1,axisLabelVisible:true,title});dr.push({kind:'price',obj:p});rd=[];syncUR();return p}
function clearDrawings(){dr.forEach(d=>{try{if(d.kind==='price')cs.removePriceLine(d.obj);else if(d.kind==='series')ch.removeSeries(d.obj)}catch(e){}});dr=[];rd=[];pendingDraw=null;syncUR()}
function undo(){const d=dr.pop();if(!d)return toast('Nothing to undo');try{if(d.kind==='price')cs.removePriceLine(d.obj);else if(d.kind==='series')ch.removeSeries(d.obj)}catch(e){}rd.push(d);syncUR()}
function redo(){const d=rd.pop();if(!d)return toast('Nothing to redo');try{if(d.kind==='price'){d.obj=cs.createPriceLine({price:d.price,color:d.color||'#2962ff',lineWidth:1,axisLabelVisible:true,title:d.title||''})}else if(d.kind==='series'){d.obj=ch.addLineSeries({color:d.color||'#2962ff',lineWidth:2,priceLineVisible:false,title:d.title||'Drawing'});d.obj.setData(d.points)}dr.push(d);syncUR()}catch(e){toast('Could not restore drawing')}}
let pendingDraw=null,smcOn=false,smcLines=[],smcMarkers=[];
function finishDrawing(a,b,t){
 const lo=Math.min(a.price,b.price),hi=Math.max(a.price,b.price),col='#2962ff';
 if(t==='fib'){[0,.382,.5,.618,1].forEach(r=>addDrawingLine(lo+(hi-lo)*r,'Fib '+(r*100).toFixed(1)+'%',r===.5?'#f0b90b':col));toast('Fibonacci levels added');return}
 if(t==='box'){addDrawingLine(hi,'Zone top','#26a69a');addDrawingLine(lo,'Zone bottom','#26a69a');toast('Zone bounds added (top/bottom levels)');return}
 if(t==='pos'){addDrawingLine(a.price,'Entry','#2962ff');addDrawingLine(b.price,'Risk / target','#26a69a');toast('Position levels added');return}
 if(t==='txt'){const label=prompt('Label for this price level','Note');if(label)addDrawingLine(b.price,label,'#f0b90b');return}
 if(t==='v'){const d=data.find(x=>x.time===a.time)||data.reduce((best,x)=>Math.abs(x.time-(a.time||0))<Math.abs(best.time-(a.time||0))?x:best,data[0]);if(d&&cs.setMarkers){const old=window.__fxMarkers||[];old.push({time:d.time,position:'aboveBar',color:'#f0b90b',shape:'circle',text:'│'});window.__fxMarkers=old;cs.setMarkers(old);toast('Time marker added')}else toast('Time marker needs the full chart library');return}
 if(t==='trend'||t==='zig'||t==='xab'||t==='chan'||t==='brush'){
  const points=[{time:a.time,value:a.price},{time:b.time,value:b.price}].filter(x=>x.time!=null).sort((x,y)=>x.time-y.time);
  if(points.length<2){toast('Tap two candles to draw a line');return}
  const line=ch.addLineSeries({color:col,lineWidth:t==='brush'?3:2,priceLineVisible:false,title:t==='trend'?'Trendline':t==='chan'?'Channel line':'Drawing'});line.setData(points);dr.push({kind:'series',obj:line,points,color:col,title:'Drawing'});rd=[];syncUR();toast(t==='trend'?'Trendline added':t==='chan'?'Channel base line added':'Drawing added');return;
 }
}

function ma(src,n,ema){const o=[];let e=null,buf=[];src.forEach((c,i)=>{if(ema){e=e===null?c.close:(2/(n+1))*c.close+(1-2/(n+1))*e;if(i>=n-1)o.push({time:c.time,value:e})}else{buf.push(c.close);if(buf.length>n)buf.shift();if(buf.length===n)o.push({time:c.time,value:buf.reduce((a,b)=>a+b,0)/n})}});return o}
function lineInd(title,values,color,scale='price'){if(!values.length)return toast('Not enough candles for '+title);const opts={color,lineWidth:1.7,priceLineVisible:false,title};if(scale!=='price')opts.priceScaleId=scale;const ser=ch.addLineSeries(opts);ser.setData(values.filter(v=>Number.isFinite(v.value)));extra.push(ser);return ser}
function calcRSI(src,n=14){let out=[],gain=0,loss=0;for(let i=1;i<src.length;i++){const d=src[i].close-src[i-1].close;gain+=Math.max(d,0);loss+=Math.max(-d,0);if(i>=n){if(i>n){const prev=src[i-n].close-src[i-n-1].close;gain-=Math.max(prev,0);loss-=Math.max(-prev,0)}const rs=loss===0?100:gain/loss;out.push({time:src[i].time,value:100-100/(1+rs)})}}return out}
function calcMACD(src,fast=12,slow=26,signal=9){const ef=ma(src,fast,true),es=ma(src,slow,true),map=new Map(es.map(x=>[x.time,x.value])),m=[];ef.forEach(x=>{if(map.has(x.time))m.push({time:x.time,value:x.value-map.get(x.time)})});let e=null;const sig=[];m.forEach((x,i)=>{e=e===null?x.value:2/(signal+1)*x.value+(1-2/(signal+1))*e;if(i>=signal-1)sig.push({time:x.time,value:e})});return{macd:m,signal:sig}}
function addInd(n,e,col){if(!data.length)return toast('Load verified candles first');const title=(e?'EMA ':'SMA ')+n;lineInd(title,ma(data,n,!!e),col);closeSheet();toast(title+' added')}
function addBB(){if(!data.length)return toast('Load verified candles first');const n=20,mid=ma(data,n,false),byTime=new Map(mid.map(x=>[x.time,x.value])),up=[],dn=[];for(let i=n-1;i<data.length;i++){const w=data.slice(i-n+1,i+1),m=byTime.get(data[i].time),sd=Math.sqrt(w.reduce((a,c)=>a+(c.close-m)**2,0)/n);up.push({time:data[i].time,value:m+2*sd});dn.push({time:data[i].time,value:m-2*sd})}lineInd('BB upper',up,'#8e7cc3');lineInd('BB middle',mid,'#b39ddb');lineInd('BB lower',dn,'#8e7cc3');closeSheet();toast('Bollinger Bands added')}
function addRSI(){const v=calcRSI(data);lineInd('RSI 14',v,'#ab47bc','rsi');closeSheet();toast('RSI 14 added on an independent scale')}
function addMACD(){const v=calcMACD(data);lineInd('MACD 12/26',v.macd,'#2962ff','macd');lineInd('Signal 9',v.signal,'#ff9800','macd');closeSheet();toast('MACD added on an independent scale')}
function calcADX(src,n=14){const out=[];let trS=0,pS=0,mS=0,adx=null,dxs=[];for(let i=1;i<src.length;i++){const cur=src[i],prev=src[i-1],up=cur.high-prev.high,down=prev.low-cur.low,tr=Math.max(cur.high-cur.low,Math.abs(cur.high-prev.close),Math.abs(cur.low-prev.close)),p=up>down&&up>0?up:0,m=down>up&&down>0?down:0;if(i<=n){trS+=tr;pS+=p;mS+=m}else{trS=trS-trS/n+tr;pS=pS-pS/n+p;mS=mS-mS/n+m}if(i>=n&&trS>0){const pdi=100*pS/trS,mdi=100*mS/trS,dx=100*Math.abs(pdi-mdi)/Math.max(pdi+mdi,1e-9);dxs.push(dx);if(dxs.length<n)continue;adx=adx==null?dxs.slice(-n).reduce((a,b)=>a+b,0)/n:(adx*(n-1)+dx)/n;out.push({time:cur.time,value:adx})}}return out}

 const highs=pivots.filter(p=>p.type==='H'),lows=pivots.filter(p=>p.type==='L'),lastH=highs[highs.length-1],lastL=lows[lows.length-1];if(lastH)smcLine(lastH.price,'Swing High / liquidity','#ef5350',2);if(lastL)smcLine(lastL.price,'Swing Low / liquidity','#26a69a',2);
 let trend=0;for(let i=5;i<data.length;i++){const prevH=highs.filter(p=>p.i<i).slice(-1)[0],prevL=lows.filter(p=>p.i<i).slice(-1)[0];if(prevH&&data[i].close>prevH.price&&data[i-1].close<=prevH.price){const change=trend===-1;smcLine(prevH.price,change?'CHoCH ↑':'BOS ↑',change?'#f0b90b':'#26a69a',0);smcMarkers.push({time:data[i].time,position:'belowBar',color:change?'#f0b90b':'#26a69a',shape:'arrowUp',text:change?'CHoCH':'BOS'});trend=1}if(prevL&&data[i].close<prevL.price&&data[i-1].close>=prevL.price){const change=trend===1;smcLine(prevL.price,change?'CHoCH ↓':'BOS ↓',change?'#f0b90b':'#ef5350',0);smcMarkers.push({time:data[i].time,position:'aboveBar',color:change?'#f0b90b':'#ef5350',shape:'arrowDown',text:change?'CHoCH':'BOS'});trend=-1}}
 let fvg=0,ob=0;for(let i=Math.max(2,data.length-120);i<data.length;i++){if(data[i-2].high<data[i].low){smcLine((data[i-2].high+data[i].low)/2,'Bullish FVG mid','#26a69a',2);fvg++}else if(data[i-2].low>data[i].high){smcLine((data[i-2].low+data[i].high)/2,'Bearish FVG mid','#ef5350',2);fvg++}}

 smcLines=smcLines.slice(-20);smcMarkers=smcMarkers.slice(-80);if(cs.setMarkers){try{cs.setMarkers(smcMarkers)}catch(e){}}toast('SMC updated: swing levels, BOS/CHoCH, FVG/OB references. Educational analysis only.');}

{name:'Bollinger Bands',code:'//@version=5\nindicator("BB")\nbasis = ta.sma(close, 20)\nplot(basis, color=color.gray)\nplot(basis + 2.0 * ta.stdev(close, 20), color=color.red)\nplot(basis - 2.0 * ta.stdev(close, 20), color=color.green)'},
{name:'EMA 9/21 Cross',code:'//@version=5\nindicator("EMA 9/21 Cross")\n\nfast = ta.ema(close, 9)\nslow = ta.ema(close, 21)\n\nplot(fast, color=color.lime, title="EMA 9")\nplot(slow, color=color.red, title="EMA 21")'}];
class Pine{
 run(src,cs){const L=src.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('//'));
  if(!L.some(l=>l.startsWith('indicator(')))throw Error('Add indicator("name") at the top');
  this.n=cs.length;const V=this.V={close:cs.map(c=>c.close),open:cs.map(c=>c.open),high:cs.map(c=>c.high),low:cs.map(c=>c.low),bar_index:cs.map((_,i)=>i),volume:cs.map(c=>c.volume??null)};const P=[],hl=[];
  for(const l of L){if(l.startsWith('indicator(')||l.startsWith('bgcolor('))continue;
   if(l.startsWith('hline(')){hl.push(+l.slice(6,-1).split(',')[0]);continue}
   if(l.startsWith('plot(')){const a=this.sp(l.slice(5,-1));let color='#2962ff',title='plot';
    a.slice(1).forEach(x=>{let m=x.match(/color\s*=\s*([\w.]+)/);if(m)color=PCOL[m[1]]||m[1];m=x.match(/title\s*=\s*"([^"]+)"/);if(m)title=m[1]});
    P.push({v:this.ev(a[0]),color,title});continue}
   const m=l.match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);if(m){V[m[1]]=this.ev(m[2]);continue}
   throw Error('Unknown line: '+l)}
  return{hl,plots:P.map(p=>({color:p.color,title:p.title,data:cs.map((c,i)=>({time:c.time,value:Array.isArray(p.v)?p.v[i]:p.v})).filter(d=>d.value!=null&&!isNaN(d.value))}))}}
 sp(s){const o=[];let d=0,c='';for(const h of s){if(h==='('||h==='[')d++;if(h===')'||h===']')d--;if(h===','&&!d){o.push(c.trim());c=''}else c+=h}if(c.trim())o.push(c.trim());return o}
 top(s,op){let d=0;for(let i=0;i<s.length;i++){const c=s[i];if(c==='(')d++;if(c===')')d--;if(!d&&s.startsWith(op,i))return i}return -1}
 topR(s,ops){let d=0;for(let i=s.length-1;i>0;i--){const c=s[i];if(c===')')d++;if(c==='(')d--;if(!d&&ops.includes(c)&&/[\w)\]]$/.test(s.slice(0,i).trimEnd()))return i}return -1}
 bin(a,b,f){const A=Array.isArray(a),B=Array.isArray(b);if(!A&&!B)return f(a,b);
  return Array.from({length:this.n},(_,i)=>{const x=A?a[i]:a,y=B?b[i]:b;return x==null||y==null?null:f(x,y)})}
 ev(e){e=e.trim();const q=this.top(e,'?');

  else {bars=await tdget(x,TD_INTERVAL[TFS[st.tf][0]]);if(id!==lid)return;}

   ws.onmessage=m=>{if(id!==lid)return;got=1;const q=JSON.parse(m.data).k,b={time:q.t/1000,open:+q.o,high:+q.h,low:+q.l,close:+q.c};
    x.p=b.close;const l=data[data.length-1],newBar=!l||l.time!==b.time;if(l&&l.time===b.time)data[data.length-1]=b;else data.push(b);cs.update(b);head(b);refreshAppliedScripts();if(smcOn&&newBar)runSMC()};
   ws.onclose=()=>{if(id!==lid||++tries>6)return;if(!got&&hi<WSH.length-1)hi++;setTimeout(()=>{if(id===lid)open()},got?2000:500)}};open()}
 catch(e){if(id===lid){x.live=false;x.liveChart=false;data=[];cs.setData([]);head(null);if(!warned){warned=1;toast('No verified candles: '+(e.message||'data unavailable'))}}}}
